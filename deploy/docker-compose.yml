# Runs ON the Hetzner server (lives in /opt/sollicitations).
# Image tags + secrets are supplied via the .env file (created once by hand at bootstrap,
# see deploy/README.md; the WEB_IMAGE/API_IMAGE lines are then updated per-deploy by CI).
# This file itself is copied over on every deploy — the repo is the source of truth.
#
# Frontend + backend join the shared `traefik-web` network (owned by the euro-millions
# / Traefik stack) for public TLS routing. Postgres stays on a PRIVATE network and is
# never exposed to Traefik or the internet.
#
# The server is shared with euro-millions, so every service is memory-capped and has
# rotated logs: this stack must never be able to starve the box or fill its disk.

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *defaults
    image: ${WEB_IMAGE:-ghcr.io/typhion/sollicitations-web:latest}
    pull_policy: always
    mem_limit: 64m
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-web
      - traefik.http.routers.sol-web.rule=Host(`admin.typhion.com`)
      - traefik.http.routers.sol-web.entrypoints=websecure
      - traefik.http.routers.sol-web.tls.certresolver=le
      - traefik.http.services.sol-web.loadbalancer.server.port=8080
    networks:
      - web

  api:
    <<: *defaults
    image: ${API_IMAGE:-ghcr.io/typhion/sollicitations-api:latest}
    pull_policy: always
    mem_limit: 512m
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Connection string targets the `db` SERVICE NAME, resolved on the private
      # network. The password comes from .env — never hardcode it.
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Required secrets — `:?` makes compose refuse to start if they're missing from .env.
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set in .env}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env}
      # Links in invite emails point at the SPA.
      App__FrontendBaseUrl: https://admin.typhion.com
      # SMTP for invite emails. Leave EMAIL_HOST empty to disable sending (admins then
      # copy the invite link from the UI). Values come from .env — never hardcode them.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Solicitations}
      # Google Maps Platform. Empty server key = verification off (free-text addresses only).
      GoogleMaps__ServerApiKey: ${GOOGLE_MAPS_SERVER_KEY:-}
      GoogleMaps__BrowserApiKey: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GoogleMaps__MapId: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # The api sits on two networks; tell Traefik which one to reach it on, otherwise
      # it may pick the private network's IP (unreachable from Traefik) and serve 502s.
      - traefik.docker.network=traefik-web
      - traefik.http.routers.sol-api.rule=Host(`api.admin.typhion.com`)
      - traefik.http.routers.sol-api.entrypoints=websecure
      - traefik.http.routers.sol-api.tls.certresolver=le
      - traefik.http.services.sol-api.loadbalancer.server.port=8080
    networks:
      - web        # receive traffic from Traefik (and outbound SMTP)
      - internal   # reach the database

  db:
    <<: *defaults
    image: postgres:17-alpine
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal   # ONLY the private network — no Traefik label, no host port

networks:
  web:
    # Shared Traefik network owned by the euro-millions stack. External, so nothing
    # in this project can create, change or remove it.
    name: traefik-web
    external: true
  internal:
    # Private and created by THIS project. Only api + db attach. `internal: true`
    # also cuts it off from the internet, so the db has no outbound access at all.
    driver: bridge
    internal: true

volumes:
  pgdata:
