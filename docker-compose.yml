# Local development only: just Postgres. The API and frontend run natively:
#   dotnet run --project backend/WebApi     # http://localhost:5182
#   cd frontend && npm start                # http://localhost:4200
# NOT the server stack — that lives in deploy/docker-compose.yml and runs on Hetzner.
#
# Usage:
#   docker compose up -d        # start Postgres in the background (or: make up)
#   docker compose down         # stop it (data is kept in the named volume)
#   docker compose down -v      # stop it AND wipe the data volume
#
# The dev password is plaintext on purpose — it only ever runs on your machine.
# Override it by creating a (gitignored) .env file; see .env.example.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solicitations
      POSTGRES_USER: solicitations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      # Exposed on localhost so the API (and tools like psql / DataGrip) can reach it.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solicitations -d solicitations"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
