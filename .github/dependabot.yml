# Keeps actions, packages and base images patched. Each ecosystem's updates are grouped
# into a single monthly PR to keep the noise down; security updates still arrive as soon
# as an advisory lands (enable "Dependabot security updates" in the repo settings).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: monthly }
    groups: { nuget: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
    groups: { docker: { patterns: ["*"] } }
