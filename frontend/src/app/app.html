<div class="flex min-h-screen flex-col">
    <nav class="border-border bg-surface flex items-center justify-between border-b px-6 py-3">
        <a
            class="text-foreground text-base font-semibold tracking-tight no-underline"
            routerLink="/solicitations"
        >
            {{ 'app.name' | t }}
        </a>

        <div class="flex items-center gap-2">
            <button
                type="button"
                [cdkMenuTriggerFor]="languageMenu"
                class="text-muted hover:bg-surface-hover hover:text-foreground aria-expanded:bg-surface-hover aria-expanded:text-foreground focus-visible:ring-accent inline-flex h-8 items-center gap-1.5 rounded-md px-2 transition-colors focus-visible:ring-2 focus-visible:outline-none"
                [attr.aria-label]="'language.choose' | t"
                [title]="'language.choose' | t"
            >
                <!-- globe -->
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="10" />
                    <path
                        d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                    />
                </svg>
                <span class="text-xs font-semibold tracking-wide uppercase">{{
                    i18n.language()
                }}</span>
            </button>

            <ng-template #languageMenu>
                <div appMenu class="min-w-40!">
                    @for (lang of languages; track lang.code) {
                        <button
                            appMenuItemRadio
                            [checked]="i18n.language() === lang.code"
                            [attr.lang]="lang.code"
                            (triggered)="chooseLanguage(lang.code)"
                        >
                            <span class="flex-1">{{ lang.label }}</span>
                            <span class="text-muted text-xs font-medium uppercase">{{
                                lang.code
                            }}</span>
                        </button>
                    }
                </div>
            </ng-template>

            <button
                type="button"
                class="text-muted hover:bg-surface-hover hover:text-foreground inline-flex h-8 w-8 items-center justify-center rounded-md transition-colors"
                [attr.aria-label]="
                    (theme.theme() === 'dark' ? 'theme.toLight' : 'theme.toDark') | t
                "
                (click)="theme.toggle()"
            >
                @if (theme.theme() === 'dark') {
                    <!-- sun -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
                        />
                    </svg>
                } @else {
                    <!-- moon -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                }
            </button>

            @if (auth.isLoggedIn()) {
                <button
                    type="button"
                    [cdkMenuTriggerFor]="accountMenu"
                    class="border-border text-foreground hover:bg-surface-hover focus-visible:ring-accent inline-flex h-8 items-center gap-1.5 rounded-md border px-2.5 text-sm font-medium transition-colors focus-visible:ring-2 focus-visible:outline-none"
                >
                    {{ 'nav.account' | t }}
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <ng-template #accountMenu>
                    <div appMenu>
                        <div class="px-2.5 py-1.5 text-xs">
                            <div class="text-muted">{{ 'nav.signedInAs' | t }}</div>
                            <div class="text-foreground truncate font-medium">
                                {{ auth.username() ?? ('nav.unknownUser' | t) }}
                            </div>
                        </div>
                        <div appMenuSeparator></div>
                        <button appMenuItem (triggered)="openProfile()">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            {{ 'nav.profile' | t }}
                        </button>
                        @if (auth.isAdmin()) {
                            <button appMenuItem (triggered)="openUsers()">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                    <circle cx="9" cy="7" r="4" />
                                    <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                                </svg>
                                {{ 'nav.users' | t }}
                            </button>
                        }
                        <button appMenuItem (triggered)="logout()">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <path d="m16 17 5-5-5-5M21 12H9" />
                            </svg>
                            {{ 'nav.logOut' | t }}
                        </button>
                    </div>
                </ng-template>
            }
        </div>
    </nav>

    <main class="mx-auto w-full max-w-7xl flex-1 px-6 py-8">
        <router-outlet />
    </main>
</div>
