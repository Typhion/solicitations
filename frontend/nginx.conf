server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (TLS is terminated by Traefik; the site is HTTPS-only).
  # script-src needs 'unsafe-inline' for the theme bootstrap <script> in index.html and
  # the critical-CSS onload handler; tighten later with Angular's `security.autoCsp`.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.admin.typhion.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed build assets can be cached long-term; index.html must always revalidate
  # so a deploy is picked up immediately. (`expires` keeps the add_headers above inherited.)
  location ~* \.(?:js|css|woff2?|ico|png|svg|webp)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
