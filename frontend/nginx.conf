server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (TLS is terminated by Traefik; the site is HTTPS-only).
  # script-src needs 'unsafe-inline' for the theme bootstrap <script> in index.html and
  # the critical-CSS onload handler; tighten later with Angular's `security.autoCsp`.
  # The Google hosts (and 'unsafe-eval') are Google's documented allowlist for the Maps JavaScript
  # API: https://developers.google.com/maps/documentation/javascript/content-security-policy
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com *.google.com https://*.ggpht.com *.googleusercontent.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com *.google.com *.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.admin.typhion.com https://*.googleapis.com *.google.com https://*.gstatic.com data: blob:; worker-src blob:; frame-src *.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Only fingerprinted build output (e.g. main-ZFGJD2JY.js) is safe to cache long-term: a new
  # build gets a new name. Everything else — index.html, favicons — revalidates (cheap 304s)
  # so a deploy is picked up immediately. (`expires` keeps the add_headers above inherited.)
  location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?|png|svg|webp)$" {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
